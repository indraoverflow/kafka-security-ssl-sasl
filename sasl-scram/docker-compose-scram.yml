networks:
  kafka-cluster-network:
    driver: bridge
    # ipam:
    #   config:
    #     - subnet: 172.22.0.0/16

services:
  kafka-broker-1:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-broker-1
    hostname: kafka-broker-1
    networks:
      - kafka-cluster-network
      # kafka-cluster-network:
      #   ipv4_address: 172.22.0.3
    ports:
      - "19094:9092"  # SASL_SSL client access
      - "29092:29092" # Inter-broker PLAINTEXT
      - "9093:9093"   # Controller listener
      # - "19084:19084" # JMX Exporter
    restart: on-failure
    healthcheck:
      test: >
        bash -c "
          kafka-broker-api-versions \
            --bootstrap-server kafka-broker-1:9092 \
            --command-config /etc/kafka/secrets/conf/client.properties >/dev/null 2>&1
          exit $?  # ✅ Return actual exit code from kafka-broker-api-versions
        "
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      
      # KAFKA_LISTENERS: PLAINTEXT://:29092,SASL_SSL://:9092,CONTROLLER://:9093
      KAFKA_LISTENERS: SASL_SSL://:9092,PLAINTEXT://:29092,CONTROLLER://:9093

      # KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:29092,SASL_SSL://kafka-broker-1:9092
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka-broker-1:9092,PLAINTEXT://kafka-broker-1:29092

      # KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      # KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
      CLUSTER_ID: xwKCEeWJToei3os4N3JYfQ

      # SASL SCRAM (for client connections)
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-512
      KAFKA_DEFAULT_USER: kafkabroker
      KAFKA_DEFAULT_PASSWORD: confluent

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # SSL config (for SASL_SSL)
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.broker-1.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: broker-1_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: broker-1_sslkey_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.broker-1.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: broker-1_truststore_creds
      KAFKA_SSL_CLIENT_AUTH: requested
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: HTTPS
      KAFKA_OVERRIDE_INTER_BROKER_LISTENER_NAME: SASL_SSL


      # JAAS config
      # KAFKA_OPTS: -javaagent:/etc/kafka/secrets/jmx_prometheus_javaagent-0.20.0.jar=19084:/etc/kafka/secrets/jmx.kafka.yml
      #   -Djava.security.auth.login.config=/etc/kafka/secrets/conf/kafka_server_jaas.conf
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/conf/kafka_server_jaas.conf
    volumes:
      - ${KAFKA_SSL_SECRETS_DIR}/broker-1:/etc/kafka/secrets
      - ${KAFKA_SASL_SCRAM_SECRETS_DIR}:/etc/kafka/secrets/conf
      - ./server.properties:/etc/kafka/server.properties
      - ${KAFKA_SASL_SCRAM_CONFIG_DIR}/client-1.properties:/etc/kafka/secrets/conf/client.properties
      # - ${KAFKA_SASL_SCRAM_CONFIG_DIR}/kafka-broker-1.properties:/etc/kafka/kafka.properties

